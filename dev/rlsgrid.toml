# rlsgrid.toml — generated by `rlsgrid init --from-db`, then two changes for apps where rows belong to
# auth.users (the usual Supabase setup): "auth" added to schema_search_path and removed from [exclude],
# so rlsgrid can create its test users first. Without them every insert fails its foreign key.
# Detection notes (verify before trusting):
#   - tenant_column guessed as 'user_id' (found as a foreign key)
#   - tenant root table detected: auth.users keyed on 'id'
#   - Supabase detected

[connection]
url = "env:DATABASE_URL"
schema_search_path = ["public", "auth"]

[tenancy]
# Tenant root table detected: auth.users (keyed on id); rlsgrid seeds it first.
mode = "jwt"
tenant_column = "user_id"
user_id_column = "user_id"
auth_function = "auth.uid()"
jwt_shape = "json"
jwt_claims = { sub = "{user_id}", user_id = "{tenant_id}", role = "authenticated" }

[roles]
authenticated = "logged-in Supabase user"
anon = "public unauthenticated"
service_role = "backend bypass — never expose client-side"

[fuzz]
iterations = 300
seed = 42
stop_on_first_breach = false

[exclude]
schemas = ["pg_catalog", "information_schema", "storage", "graphql", "graphql_public", "extensions", "realtime", "supabase_functions", "vault", "pgsodium", "pgsodium_masks", "net"]
tables = []

[safety]
forbid_url_patterns = ["prod", "production"]
